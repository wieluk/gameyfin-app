# Flatpak manifest, built from the prebuilt `.deb` rather than compiled in the sandbox.
# Targets self-distribution (a `.flatpak` bundle on a GitHub release), not Flathub, which
# would require a source build.
app-id: org.gameyfin.Gameyfin
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: gameyfin-app
separate-locales: false

# This is a self-distributed bundle, not a Flathub submission, so a separate debuginfo
# extension is weight nobody downloads. Skipping it also drops the build's dependency on
# elfutils, which is not present everywhere the bundle gets built.
build-options:
  no-debuginfo: true
  strip: true

finish-args:
  # `flatpak-spawn` on the host, used to run Wine outside the sandbox.
  - --talk-name=org.freedesktop.Flatpak

  # Talking to a Gameyfin server, and the webview's own IPC.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # Games need audio, controllers and the GPU.
  - --socket=pulseaudio
  - --device=all
  - --allow=devel

  # Required for 32-bit Windows programs: without it seccomp blocks i386 and `modify_ldt`,
  # and every 32-bit executable (Inno Setup stubs, much of Unity) fails at CreateProcess.
  - --allow=multiarch

  # The library root is chosen at runtime, so narrower filesystem access is not possible.
  - --filesystem=home
  - --filesystem=xdg-download:create
  - --filesystem=/run/media

  # Wine and Proton prefixes, plus the Steam locations we register shortcuts into.
  - --filesystem=~/.steam:rw
  - --filesystem=~/.local/share/Steam:rw
  - --filesystem=~/.var/app/com.valvesoftware.Steam:rw

  # Tray icon, notifications, and the keychain that holds the device token.
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.secrets

  - --env=PATH=/app/bin:/usr/bin

  # WebKitGTK's DMA-BUF renderer crashes some Wayland compositors (Error 71) before the
  # window appears. Override per machine with `flatpak override --user --unset-env=...`.
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1

modules:
  # The tray icon. Neither the GNOME runtime nor its SDK carries appindicator, and Tauri's
  # tray aborts the process when the library is missing, so these three have to be built
  # here or the app cannot start at all inside the sandbox.
  # libdbusmenu's configure insists on intltool, which the GNOME SDK does not ship.
  # Build-time only, so all of it is cleaned back out of the finished app.
  - name: intltool
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd
      - type: shell
        commands:
          # Unescaped braces in a regex have been a hard error in perl since 5.26.
          - sed -i 's/\\${/\\$\\{/g' intltool-update.in

  - name: libdbusmenu
    buildsystem: autotools
    build-options:
      # A 2016 codebase against a 2025 glib: it builds with -Werror and every deprecated
      # symbol is now a warning. Appended after the package's own flags, so this wins.
      cflags: -Wno-error -Wno-deprecated-declarations
      env:
        # The tarball's configure leaves these substitutions unresolved without valgrind,
        # which the runtime does not ship, and the generated Makefile then fails to parse.
        HAVE_VALGRIND_TRUE: '#'
        HAVE_VALGRIND_FALSE: ''
    config-opts:
      - --with-gtk=3
      - --disable-dumper
      - --disable-static
      - --disable-tests
      - --disable-gtk-doc
      - --disable-vala
      - --enable-introspection=no
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/doc
    sources:
      - type: archive
        url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a

  - name: ayatana-ido
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      # CMake defaults to lib64 here, where flatpak's pkg-config never looks.
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_TESTS=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/ayatana-ido/archive/refs/tags/0.10.4.tar.gz
        sha256: bd59abd5f1314e411d0d55ce3643e91cef633271f58126be529de5fb71c5ab38

  - name: libayatana-indicator
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      # CMake defaults to lib64 here, where flatpak's pkg-config never looks.
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_TESTS=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/libayatana-indicator/archive/refs/tags/0.9.4.tar.gz
        sha256: a18d3c682e29afd77db24366f8475b26bda22b0e16ff569a2ec71cd6eb4eac95

  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      # CMake defaults to lib64 here, where flatpak's pkg-config never looks.
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_BINDINGS_MONO=OFF
      - -DENABLE_BINDINGS_VALA=OFF
      - -DFLAVOUR_GTK3=ON
      # The library links fine; its gtk-doc step does not, and API documentation is not
      # something a runtime bundle has any use for.
      - -DENABLE_GTKDOC=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/libayatana-appindicator/archive/refs/tags/0.5.93.tar.gz
        sha256: cbefed7a918a227bf71286246e237fcd3a9c8499b3eaac4897811a869409edf0

  # 7-Zip for unpacking downloads: the sandbox has no host `7z`/`unar` to fall back to.
  - name: sevenzip
    buildsystem: simple
    build-commands:
      - cd CPP/7zip/Bundles/Alone2 && make -j ${FLATPAK_BUILDER_N_JOBS:-4} -f ../../cmpl_gcc.mak
      - install -Dm755 CPP/7zip/Bundles/Alone2/b/g/7zz /app/bin/7zz
    sources:
      - type: archive
        url: https://7-zip.org/a/7z2501-src.tar.xz
        sha256: ed087f83ee789c1ea5f39c464c55a5c9d4008deb0efe900814f2df262b82c36e
        # No wrapping directory in the tarball.
        strip-components: 0

  - name: gameyfin
    buildsystem: simple
    build-commands:
      # Unpack the prebuilt deb.
      - ar x gameyfin.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/gameyfin-app /app/bin/gameyfin-app

      # The save backup helper, shipped as a Tauri sidecar. Guarded so a deb built before
      # save sync still produces a working bundle, just without save support.
      - |
        set -e
        if [ -f usr/bin/ludusavi ]; then
          install -Dm755 usr/bin/ludusavi /app/bin/ludusavi
          install -Dm644 usr/bin/LUDUSAVI-LICENSE.txt \
            /app/share/licenses/org.gameyfin.Gameyfin/LUDUSAVI-LICENSE.txt 2>/dev/null || true
        fi

      # Desktop file, icons and metainfo must be named after the app id.
      - install -Dm644 usr/share/applications/Gameyfin.desktop
        /app/share/applications/org.gameyfin.Gameyfin.desktop
      - desktop-file-edit --set-icon=org.gameyfin.Gameyfin
        /app/share/applications/org.gameyfin.Gameyfin.desktop
      # Iterate over the icon sizes the deb actually contains.
      - |
        set -e
        for src in usr/share/icons/hicolor/*/apps/gameyfin-app.png; do
          [ -f "$src" ] || continue
          size=$(basename "$(dirname "$(dirname "$src")")")
          # Tauri emits "256x256@2"; the hicolor spec spells it "@2x", and a directory
          # named otherwise is skipped by icon lookup, wasting the largest size we ship.
          case "$size" in *@2) size="${size}x";; esac
          install -Dm644 "$src" \
            "/app/share/icons/hicolor/${size}/apps/org.gameyfin.Gameyfin.png"
        done
      - install -Dm644 org.gameyfin.Gameyfin.metainfo.xml
        /app/share/metainfo/org.gameyfin.Gameyfin.metainfo.xml
    sources:
      - type: file
        path: ../build/gameyfin.deb
      - type: file
        path: org.gameyfin.Gameyfin.metainfo.xml
