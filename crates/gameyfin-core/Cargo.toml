[package]
name = "gameyfin-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Downloads, extraction and install management for the Gameyfin client"

[dependencies]
gameyfin-api = { path = "../gameyfin-api" }
gameyfin-saves = { path = "../gameyfin-saves" }
thiserror.workspace = true
serde.workspace = true
ts-rs.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest.workspace = true
sha2.workspace = true
futures-util = "0.3"
async-trait = "0.1"
time.workspace = true
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd", "lzma"] }
sevenz-rust2 = "0.13"
tar = "0.4.46"
liblzma = { version = "0.4.8", features = ["static"] }
# The other tar wrappers, already in the tree through `zip`.
flate2 = "1"
bzip2 = "0.5"
zstd = "0.13"
# Vulkan bindings, dynamically loaded so a machine without a driver still starts.
ash = "0.38"
# Shortcut icons from covers and Windows executables. Already in the tree through Tauri.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree through gilrs; watches for the DLL an installer is about to call.
inotify = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
mockito = "1"
gameyfin-saves = { path = "../gameyfin-saves", features = ["test-util"] }
