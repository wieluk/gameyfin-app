[package]
name = "gameyfin-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Downloads, extraction and install management for the Gameyfin client"

[dependencies]
gameyfin-api = { path = "../gameyfin-api" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest.workspace = true
sha2.workspace = true
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd", "lzma"] }
sevenz-rust2 = "0.13"
tar = "0.4.46"
liblzma = { version = "0.4.8", features = ["static"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
mockito = "1"
