name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A tag can point at any commit, so re-run CI before building the release.
  test:
    uses: ./.github/workflows/ci.yml

  bundle:
    name: bundle (${{ matrix.os }})
    needs: test
    # Creates the draft release and uploads to it.
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Every build step below runs third-party code; none of it needs the token.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Tauri's Linux build needs the system WebKit/GTK development packages.
      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf libudev-dev xdg-utils

      # The tag is the only source of truth for the version. Through the environment, so
      # a tag name cannot become part of the command.
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/set-version.mjs "$TAG"

      - run: npm ci

      # Declared as sidecars, so the bundle cannot be built without them on disk.
      - run: npm run fetch-sidecars

      # Tauri signs last, so a missing key wasted the whole build and then failed with a
      # message that named neither the variable nor the fix.
      - name: Check the updater signing setup
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/check-signing.mjs

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts, and `createUpdaterArtifacts` makes that mandatory:
          # without a key the build fails at the end rather than skipping them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # A manual run builds the bundles and stops there: only a tag makes a release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Gameyfin Desktop ${{ github.ref_name }}
          releaseDraft: true

      # The Flatpak is assembled from this deb. Handing it over is what keeps the flatpak
      # job from building the whole app a second time.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: deb-bundle
          path: target/release/bundle/deb/*.deb
          retention-days: 1

  flatpak:
    name: flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The draft release must exist before the bundle can be attached to it, and the deb
    # this repackages comes from that job.
    needs: bundle
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak flatpak-builder desktop-file-utils ostree

      - name: Add Flathub and install the GNOME runtime
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.gnome.Platform//50 org.gnome.Sdk//50

      # Repackaged from the deb the bundle job already built, rather than compiling the
      # whole app a second time. The version is read from the deb's filename, so this
      # needs no toolchain, no sidecar and no version step of its own.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: deb-bundle
          path: build

      - run: npm run package:flatpak

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flatpak-bundle
          path: build/*.flatpak

      - name: Attach the Flatpak to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "$GITHUB_REF_NAME" build/*.flatpak --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A `.flatpak` bundle cannot update itself, so also export into an ostree repo that
      # `flatpak update` can track. Fetch the existing one first to keep its history.
      - name: Fetch the published Flatpak repository
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        continue-on-error: true
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false

      - name: Export the build into the Flatpak repository
        if: startsWith(github.ref, 'refs/tags/')
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p pages/repo
          # An empty directory is not an ostree repo, and importing into one fails with
          # "opendir(objects): No such file or directory". That is every first release,
          # and any release after the gh-pages checkout above could not find the branch.
          if [ ! -d pages/repo/objects ]; then
            ostree init --mode=archive-z2 --repo=pages/repo
          fi
          # Git keeps no empty directories, so the repo fetched from gh-pages lost these and
          # `--generate-static-deltas` fails with "opendir(refs/remotes)". `ostree init` skips them.
          mkdir -p pages/repo/{extensions,objects,state,tmp/cache} pages/repo/refs/{heads,mirrors,remotes}
          flatpak build-import-bundle pages/repo build/*.flatpak
          flatpak build-update-repo --generate-static-deltas --prune pages/repo

          # The file a user opens to add the remote. Unsigned: HTTPS from a fixed origin.
          # Addresses come from the repository running this, so a fork publishes its own
          # Pages site rather than pointing everyone it reaches at somebody else's.
          cat > pages/repo/gameyfin.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Gameyfin
          Url=https://${OWNER}.github.io/${REPO_NAME}/repo/
          Homepage=${SERVER_URL}/${REPOSITORY}
          Comment=Gameyfin desktop client
          Description=Updates for the Gameyfin desktop client
          EOF

      - name: Publish the repository to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/')
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages/repo
          destination_dir: repo
          keep_files: true
