name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  bundle:
    name: bundle (${{ matrix.os }})
    needs: test
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf libudev-dev

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/set-version.mjs "$TAG"

      - run: npm ci

      # Declared as sidecars, so the bundle cannot be built without them on disk.
      - run: npm run fetch-sidecars

      - name: Check the updater signing setup
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/check-signing.mjs

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Gameyfin Desktop ${{ github.ref_name }}
          releaseDraft: true

      # The flatpak job repackages this deb rather than building the app again.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: deb-bundle
          path: target/release/bundle/deb/*.deb
          retention-days: 1

  flatpak:
    name: flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: bundle
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # Release notes come from the commits since the previous tag.
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # A fresh checkout, so the metainfo release needs setting again.
      - name: Set the version and release notes from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/set-version.mjs "$TAG"
          node scripts/release-notes.mjs metainfo "$TAG"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak flatpak-builder desktop-file-utils ostree

      - name: Add Flathub and install the GNOME runtime
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: deb-bundle
          path: build

      # Only tagged builds are published, so only they are signed and point at the repository.
      - name: Import the Flatpak signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [ -z "$FLATPAK_GPG_PRIVATE_KEY" ]; then
            echo "::error::The FLATPAK_GPG_PRIVATE_KEY secret is not set."
            exit 1
          fi
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import

          # A secret from another key pair fails here instead of on users' machines.
          key=$(gpg --with-colons --import-options show-only --import flatpak/gameyfin-repo.gpg \
            | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$key" ] || ! gpg --list-secret-keys "$key" >/dev/null 2>&1; then
            echo "::error::FLATPAK_GPG_PRIVATE_KEY does not match flatpak/gameyfin-repo.gpg."
            exit 1
          fi

          echo "FLATPAK_GPG_KEY_ID=$key" >> "$GITHUB_ENV"
          echo "FLATPAK_REPO_URL=https://${OWNER}.github.io/${REPO_NAME}/repo/" >> "$GITHUB_ENV"

      - run: npm run package:flatpak

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flatpak-bundle
          path: build/*.flatpak

      - name: Attach the Flatpak to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "$GITHUB_REF_NAME" build/*.flatpak --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A `.flatpak` bundle cannot update itself, so also export into an ostree repo that
      # `flatpak update` can track. Fetch the existing one first to keep its history.
      # Checkout retries a missing branch for a minute and logs an error, so look first.
      - name: Look for the published Flatpak repository
        id: pages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No gh-pages branch yet, so this release starts a new repository."
          fi

      - name: Fetch the published Flatpak repository
        if: steps.pages.outputs.exists == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false

      - name: Export the build into the Flatpak repository
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p pages/repo

          if [ ! -d pages/repo/objects ]; then
            ostree init --mode=archive-z2 --repo=pages/repo
          fi

          mkdir -p pages/repo/{extensions,objects,state,tmp/cache} pages/repo/refs/{heads,mirrors,remotes}
          # The commit is already signed inside the bundle. The summary is signed here.
          flatpak build-import-bundle pages/repo build/*.flatpak
          # A few old versions per ref, so the repository does not grow with every release.
          flatpak build-update-repo --gpg-sign="$FLATPAK_GPG_KEY_ID" \
            --generate-static-deltas --prune --prune-depth=3 pages/repo

          cat > pages/repo/gameyfin.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Gameyfin
          Url=${FLATPAK_REPO_URL}
          Homepage=${SERVER_URL}/${REPOSITORY}
          Comment=Gameyfin desktop client
          Description=Updates for the Gameyfin desktop client
          GPGKey=$(base64 -w0 flatpak/gameyfin-repo.gpg)
          EOF

      - name: Publish the repository to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/')
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages/repo
          destination_dir: repo
          keep_files: true

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [bundle, flatpak]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # Release notes come from the commits since the previous tag.
          fetch-depth: 0

      - name: Publish the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs markdown "$TAG" > notes.md
          # A pre-release tag must not become "latest": the updaters read that release.
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease \
              --notes-file notes.md
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
              --notes-file notes.md
          fi
