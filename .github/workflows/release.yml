name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Draft release creation, and Pages for the Flatpak repository.
permissions:
  contents: write
  pages: write

jobs:
  # A tag can point at any commit, so re-run CI before building the release.
  test:
    uses: ./.github/workflows/ci.yml

  bundle:
    name: bundle (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Tauri's Linux build needs the system WebKit/GTK development packages.
      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf libudev-dev xdg-utils

      # The tag is the only source of truth for the version.
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${{ github.ref_name }}"

      - run: npm ci

      # Declared as a sidecar, so the bundle cannot be built without it on disk.
      - run: npm run fetch-ludusavi

      # Tauri signs last, so a missing key wasted the whole build and then failed with a
      # message that named neither the variable nor the fix.
      - name: Check the updater signing setup
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/check-signing.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts, and `createUpdaterArtifacts` makes that mandatory:
          # without a key the build fails at the end rather than skipping them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Gameyfin Desktop ${{ github.ref_name }}
          releaseDraft: true

  flatpak:
    name: flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The draft release must exist before the bundle can be attached to it.
    needs: bundle
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf libudev-dev xdg-utils \
            flatpak flatpak-builder desktop-file-utils

      - name: Add Flathub and install the GNOME runtime
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.gnome.Platform//48 org.gnome.Sdk//48

      # The tag is the only source of truth for the version.
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${{ github.ref_name }}"

      - run: npm ci
      - run: npm run fetch-ludusavi

      # The Flatpak is assembled from the deb, so that has to exist first.
      - run: npm run package deb
      - run: npm run package:flatpak

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle
          path: build/*.flatpak

      - name: Attach the Flatpak to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "$GITHUB_REF_NAME" build/*.flatpak --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A `.flatpak` bundle cannot update itself, so also export into an ostree repo that
      # `flatpak update` can track. Fetch the existing one first to keep its history.
      - name: Fetch the published Flatpak repository
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: gh-pages
          path: pages

      - name: Export the build into the Flatpak repository
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          mkdir -p pages/repo
          flatpak build-import-bundle pages/repo build/*.flatpak
          flatpak build-update-repo --generate-static-deltas --prune pages/repo

          # The file a user opens to add the remote. Unsigned: HTTPS from a fixed origin.
          cat > pages/repo/gameyfin.flatpakrepo <<'EOF'
          [Flatpak Repo]
          Title=Gameyfin
          Url=https://gameyfin.github.io/gameyfin-app/repo/
          Homepage=https://github.com/gameyfin/gameyfin-app
          Comment=Gameyfin desktop client
          Description=Updates for the Gameyfin desktop client
          EOF

      - name: Publish the repository to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages/repo
          destination_dir: repo
          keep_files: true
