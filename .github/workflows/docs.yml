name: Docs

# Only when prose changes: the code checks live in ci.yml.
on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "docs/**"
      - "package.json"
  pull_request:
    paths:
      - "**.md"
      - "docs/**"
      - "package.json"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Markdown and spelling
        run: npm run lint:docs
      # The app's help buttons point at headings here, and ci.yml skips docs-only changes.
      - name: Help links still land on a heading
        run: npx vitest run src/lib/help.test.ts
      # Also the link check: the build fails on a link to a page that does not exist.
      - name: Build the site
        run: npm run docs:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-site
          path: docs/.vitepress/dist

  # gh-pages also holds the Flatpak repository in repo/, published by release.yml. Each keeps to
  # its own folder, and a cleaning deploy only ever removes files inside its own.
  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # gh-pages is shared with the Flatpak publish in release.yml; one writer at a time.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: docs-site
          path: site
      - name: Publish the docs
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          destination_dir: docs
      # The site root has nothing of its own, so it points at the docs.
      - name: Redirect the site root to the docs
        run: |
          mkdir root
          cat > root/index.html <<'EOF'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=docs/">
          <link rel="canonical" href="docs/">
          <a href="docs/">gameyfin-app documentation</a>
          EOF
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: root
          keep_files: true
