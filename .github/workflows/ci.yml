name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Skipping here rather than in `on:` keeps the required "CI result" check on every PR.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # A release run, where the filter is skipped, tests everything.
      app: ${{ steps.filter.outputs.app || 'true' }}
    steps:
      # Pull requests are compared through the API; a push to main needs the history.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          predicate-quantifier: every
          filters: |
            app:
              - "**"
              - "!**/*.md"
              - "!docs/**"
              - "!assets/**"
              - "!flatpak/**"
              - "!.github/renovate.json5"
              - "!.gitignore"
              - "!LICENSE"

  frontend:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The Tauri shell is a workspace member; Linux needs WebKit/GTK dev packages.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf libudev-dev

      # `frontendDist` points at ../dist, so the frontend must be built first.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build

      # Declared as sidecars, so they have to be on disk before anything compiles,
      # `cargo check` included. umu-run is Linux only and the script knows it.
      - run: npm run fetch-sidecars

      # Formatting does not vary by platform, so one leg is enough.
      - run: cargo fmt --all -- --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # `cargo test` regenerates the TypeScript the webview builds against, so a change to
      # a Rust type that was not exported would only surface as a type error much later.
      - name: Check the generated bindings are up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code src/bindings

  # The one check main requires: passes when the jobs above pass or were not needed.
  result:
    name: CI result
    if: always()
    needs: [changes, frontend, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
