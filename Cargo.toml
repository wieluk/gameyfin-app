[workspace]
resolver = "2"
members = ["crates/gameyfin-api", "crates/gameyfin-core", "crates/gameyfin-saves", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/gameyfin/gameyfin-app"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "cookies"] }
url = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

[profile.release]
opt-level = "s"
# Thin LTO with parallel codegen: full LTO at one codegen unit roughly triples link time
# for a few percent of size, which is a poor trade on every packaging run.
lto = "thin"
codegen-units = 16
strip = true

[profile.dev]
# Debug info dominates link time for a binary this size, and a backtrace with line numbers
# is all that is actually used during development.
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 0

[profile.test]
debug = "line-tables-only"
