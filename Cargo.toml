[workspace]
resolver = "2"
members = ["crates/gameyfin-api", "crates/gameyfin-core", "crates/gameyfin-saves", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wieluk/gameyfin-app"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util"] }
tracing = "0.1"
# `gzip`: the catalogue is JSON that shrinks several times over, where a server or proxy compresses.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "rustls-no-provider", "cookies", "gzip"] }
# The crypto provider reqwest leaves to the app: ring, as the updater plugin uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
url = "2"
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
ts-rs = { version = "12", features = ["no-serde-warnings"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true

# Pixel loops are where "s" costs most: scaling a cover takes a sixth of the time at 3.
[profile.release.package.image]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.dev]
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 0

[profile.test]
debug = "line-tables-only"
